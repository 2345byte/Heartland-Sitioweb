<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error 404 - Página no encontrada</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Merriweather', serif;
      background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0,0,0,0.5)), url('img/ranch.jpg') center/cover no-repeat;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #fff;
    }

    h1 {
      font-size: 90px;
      margin: 0;
      color: #f8c471;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
    }

    h2 {
      font-size: 28px;
      margin-bottom: 10px;
      font-family: 'Playfair Display', serif;
    }

    p {
      font-size: 18px;
      max-width: 600px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    a {
      color: #fff;
      background-color: #6b4226;
      padding: 12px 30px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    a:hover {
      background-color: #f8c471;
      color: #3e2b20;
      transform: scale(1.05);
    }

    .logo {
      width: 120px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
    }
  </style>
</head>
<body>
 
  <h1>404</h1>
  <h2>¡Oops! Este evento no se encuentra disponible</h2>
  <p>Parece que el rancho está cerrado por hoy... <br>
  Volvé al inicio para seguir explorando el mundo de <strong>Heartland</strong>.</p>
  <a href="index.html">Volver al inicio</a>
</body>
</html>
